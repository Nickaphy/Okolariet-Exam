
name: CI

on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]

# Ensures the generated token only has read access to the repo
permissions: 
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Retrieve the source code of the repository

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4 # Set up the .NET environment
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore okolariet-exam.sln # Resolves NuGet dependencies for the solution

      - name: Build solution
        run: dotnet build okolariet-exam.sln --configuration Release --no-restore # Builds the solution in Release mode without restoring dependencies



