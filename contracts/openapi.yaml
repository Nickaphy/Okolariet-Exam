  /templates/{templateType}:
    parameters:
      - $ref: '#/components/parameters/TemplateType'
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Get one template definition (admin)
      responses:
        '200':
          description: The template definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- MODDED TEMPLATES
  /projects/{projectId}/modded-templates:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [ModdedTemplates]
      operationId: listModdedTemplates
      summary: List the modded templates of a project (admin)
      responses:
        '200':
          description: Modded templates ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModdedTemplateSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ModdedTemplates]
      operationId: createModdedTemplate
      summary: Create a modded template from a template (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModdedTemplateCreate'
      responses:
        '201':
          description: Modded template created
          headers:
            Location:
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModdedTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /modded-templates/{moddedTemplateId}:
    parameters:
      - $ref: '#/components/parameters/ModdedTemplateId'
    get:
      tags: [ModdedTemplates]
      operationId: getModdedTemplate
      summary: Get a modded template with its items and questions (admin)
      description: Admin representation, so answers include `isCorrect`.
      responses:
        '200':
          description: The modded template
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModdedTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ModdedTemplates]
      operationId: updateModdedTemplate
      summary: Update a modded template's title, appearance and order (admin)
      description: The template type cannot be changed after creation. Requires `If-Match`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModdedTemplateUpdate'
      responses:
        '200':
          description: Modded template updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModdedTemplate'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [ModdedTemplates]
      operationId: deleteModdedTemplate
      summary: Delete a modded template (admin)
      description: |
        Blocked with 409 if a button on another modded template links to it, or if it
        is the project's start modded template. Remove the link first.
      responses:
        '204':
          description: Modded template deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ----------------------------------------------------------------- ITEMS
  /modded-templates/{moddedTemplateId}/items/{slotKey}:
    parameters:
      - $ref: '#/components/parameters/ModdedTemplateId'
      - $ref: '#/components/parameters/SlotKey'
    put:
      tags: [Items]
      operationId: setItem
      summary: Set the content of a slot (admin)
      description: |
        Creates or replaces the item in this slot (idempotent upsert). The slot
        key must exist in the template the modded template is based on, `targetModdedTemplateId` must
        belong to the same project, and the asset's kind must match the slot's
        kind (an audio file cannot go into an image slot). Last write wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModdedTemplateItemInput'
      responses:
        '200':
          description: Item replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModdedTemplateItem'
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModdedTemplateItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Items]
      operationId: clearItem
      summary: Clear a slot (admin)
      responses:
        '204':
          description: Slot cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------- QUESTIONS
  /modded-templates/{moddedTemplateId}/questions:
    parameters:
      - $ref: '#/components/parameters/ModdedTemplateId'
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: List the active questions on a quiz modded template (admin)
      responses:
        '200':
          description: Questions ordered by sortOrder, with their answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: Add a question (admin)
      description: Only allowed on modded templates whose template supports questions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '201':
          description: Question created
          headers:
            Location:
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Questions]
      operationId: getQuestion
      summary: Get a question with its answers (admin)
      responses:
        '200':
          description: The question
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Questions]
      operationId: updateQuestion
      summary: Update a question (admin)
      description: |
        Editing in place keeps the statistics. Use
        `DELETE /questions/{questionId}/results` if the meaning has changed.
        Requires `If-Match`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionInput'
      responses:
        '200':
          description: Question updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Questions]
      operationId: deleteQuestion
      summary: Remove a question (admin)
      description: Soft delete (`IsActive = false`), so historical statistics survive.
      responses:
        '204':
          description: Question removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------- ANSWERS
  /questions/{questionId}/answers:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Answers]
      operationId: createAnswer
      summary: Add an answer to a question (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInput'
      responses:
        '201':
          description: Answer created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /answers/{answerId}:
    parameters:
      - $ref: '#/components/parameters/AnswerId'
    put:
      tags: [Answers]
      operationId: updateAnswer
      summary: Update an answer (admin)
      description: |
        Changing which answer is correct is checked against the rule "exactly
        one correct answer per question" when the project is published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInput'
      responses:
        '200':
          description: Answer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Answers]
      operationId: deleteAnswer
      summary: Remove an answer (admin)
      description: Soft delete (`IsActive = false`), so historical statistics survive.
      responses:
        '204':
          description: Answer removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- ASSETS
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List uploaded media for the editor's media picker (admin)
      description: Filter by `kind` so a picture slot only offers pictures.
      parameters:
        - $ref: '#/components/parameters/AssetKindFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Assets]
      operationId: uploadAsset
      summary: Upload an image, video or audio file (admin)
      description: |
        The server detects the real file type from the file content (magic
        bytes), never from the extension or the client's Content-Type, and
        derives `kind` from it. Files are stored under a random name.

        Accepted types:
        - image: png, jpeg, webp, gif
        - video: mp4, webm, mkv (see note)
        - audio: mp3, wav, m4a (an .mp4 container holding only audio)

        Size limits are per kind (suggested: image 10 MB, audio 50 MB,
        video 500 MB) and exceeding them returns 413.

        Note: browsers do not reliably play .mkv. It is accepted for upload,
        but mp4 (H.264/AAC) or webm is recommended for the kiosk.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Media file stored
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Download or stream a media file (kiosk, anonymous)
      description: |
        Public because the kiosk loads media directly. Supports HTTP range
        requests so video and audio can start playing and seek without
        downloading the whole file. Files are immutable, so they are cached
        aggressively and served with `X-Content-Type-Options: nosniff`.
      security: []
      parameters:
        - name: Range
          in: header
          required: false
          description: Byte range, for example `bytes=0-1048575`
          schema: { type: string }
          example: bytes=0-1048575
      responses:
        '200':
          description: The complete file
          headers:
            Accept-Ranges:
              schema: { type: string, example: bytes }
            Cache-Control:
              schema: { type: string, example: 'public, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/x-matroska: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
        '206':
          description: Partial content for a range request
          headers:
            Content-Range:
              schema: { type: string, example: 'bytes 0-1048575/52428800' }
            Accept-Ranges:
              schema: { type: string, example: bytes }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            video/x-matroska: { schema: { type: string, format: binary } }
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
            audio/mp4: { schema: { type: string, format: binary } }
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Delete a media file (admin)
      description: |
        Blocked with 409 while any modded template item, question or answer
        still uses it, or while any published version references it. Snapshots
        store asset ids as plain JSON, so this needs an explicit check or a
        reference table; otherwise the live kiosk would show broken media.
      responses:
        '204':
          description: Image deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

# =============================================================== COMPONENTS
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 5e528632-2b56-555f-8467-ed93e2a5ad60
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: c0bf18f4-edc3-530a-9de3-0a61b2932826
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 3f2b8c1e-6a4d-4b0e-9d57-1c2a7e5f9a10
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET of this resource
      schema: { type: string }
      example: '"AAAAAAAAB9E="'

    ModdedTemplateId:
      name: moddedTemplateId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: d96c6a5c-053f-594b-8552-329d96f1142b
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: ee4b25bc-10af-546c-a425-a374b3c97a82
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 6078f301-c144-5d5f-a9ba-a55be9dbde22
    NicknameWordId:
      name: nicknameWordId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: d539bd3e-141b-552a-beb5-869106903a3a
    AnswerId:
      name: answerId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 2869fc10-8584-5962-a4a1-b2e88e2492db
    SlotKey:
      name: slotKey
      in: path
      required: true
      description: Slot defined by the template the modded template is based on
      schema: { type: string, pattern: '^[a-z0-9_]+$' }
      example: button1
    TemplateType:
      name: templateType
      in: path
      required: true
      schema: { type: string }
      example: quiz-classic

    AssetKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AssetKind'

  headers:
    ETag:
      description: Version of the resource, derived from its RowVersion
      schema: { type: string, example: '"AAAAAAAAB9E="' }

  schemas:
    # ---- auth
    TokenRequest:
      type: object
      description: |
        `grantType` decides which other fields are required: `password` needs
        email and password, `refresh_token` needs refreshToken.
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [password, refresh_token]
          example: password
        email: { type: string, format: email, nullable: true, example: anna@oekolariet.dk }
        password: { type: string, format: password, nullable: true, maxLength: 128, example: 'correct horse battery' }
        refreshToken: { type: string, nullable: true, description: Only for the refresh_token grant }
    Token:
      type: object
      required: [accessToken, tokenType, expiresAt, refreshToken, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2MDc4ZjMwMS1jMTQ0LTVkNWYtYTliYS1hNTViZTlkYmRlMjIiLCJlbWFpbCI6ImFubmFAb2Vrb2xhcmlldC5kayIsInJvbGUiOiJBZG1pbiIsInNpZCI6IjBkNmIyYTY0LTFkMmUtNGY3ZS05YTUxLTNjMWYyYjdhOGU5MCIsImV4cCI6MTkyNDk5MjAwMH0.mock-signature
        tokenType: { type: string, example: Bearer }
        expiresAt: { type: string, format: date-time, example: '2030-12-31T23:00:00Z' }
        refreshToken: { type: string, example: 9f8d2c7a41b64e0d8f3a5c1e7b2d6a90 }
        refreshExpiresAt: { type: string, format: date-time, example: '2030-12-31T23:59:00Z' }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: anna@oekolariet.dk }
    PasswordResetCompletion:
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken: { type: string, description: The single-use token from the e-mail link }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128, example: 'a much longer passphrase' }

    # ---- hypermedia (added incrementally; optional in v1)
    Link:
      type: object
      required: [href]
      properties:
        href: { type: string, example: /api/v1/projects/5e528632-2b56-555f-8467-ed93e2a5ad60 }
    Links:
      type: object
      description: |
        Available actions. A link is absent when the action is not allowed,
        for example `publish` while the project has validation errors.
      additionalProperties:
        $ref: '#/components/schemas/Link'

    # ---- users (guests who saved a score)
    Score:
      type: object
      required: [correct, totalQuestions, percentage]
      properties:
        correct: { type: integer, example: 7 }
        totalQuestions: { type: integer, example: 10 }
        percentage:
          type: number
          format: double
          description: correct / totalQuestions * 100
          example: 70.0
    UserCreate:
      type: object
      required: [sessionId, moddedTemplateId, nickname]
      properties:
        sessionId: { type: string, format: uuid, example: 3f2b8c1e-6a4d-4b0e-9d57-1c2a7e5f9a10 }
        moddedTemplateId:
          type: string
          format: uuid
          description: The quiz (or other game) whose result is saved
          example: 3713b920-e4cf-53a9-8ba2-e474861cf069
        nickname:
          $ref: '#/components/schemas/NicknameInput'
    User:
      type: object
      description: A guest's saved result. Only nickname, quiz and score, no personal data.
      required: [id, nickname, moddedTemplateId, score]
      properties:
        id: { type: string, format: uuid, example: ee4b25bc-10af-546c-a425-a374b3c97a82 }
        nickname: { type: string, example: ModigRæv42 }
        moddedTemplateId: { type: string, format: uuid, example: 3713b920-e4cf-53a9-8ba2-e474861cf069 }
        score:
          $ref: '#/components/schemas/Score'
    UserPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, example: 57 }

    # ---- staff
    StaffRole:
      type: string
      description: Only Admin exists today
      enum: [admin]
    StaffCreate:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 254, example: anna@oekolariet.dk }
        password: { type: string, format: password, minLength: 12, maxLength: 128, example: 'correct horse battery' }
        role:
          $ref: '#/components/schemas/StaffRole'
    StaffUpdate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254, example: anna@oekolariet.dk }
        role:
          $ref: '#/components/schemas/StaffRole'
    Staff:
      type: object
      description: A staff member. Never contains the password or its hash.
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid, example: 6078f301-c144-5d5f-a9ba-a55be9dbde22 }
        email: { type: string, format: email, example: anna@oekolariet.dk }
        role:
          $ref: '#/components/schemas/StaffRole'
    StaffPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Staff'
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, example: 3 }
    PasswordChange:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          nullable: true
          maxLength: 128
          description: Required when changing your own password. Leave out (or null) when an admin resets someone else's password.
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128, example: 'a much longer passphrase' }

    # ---- projects
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Havets Hemmeligheder }
        mainModdedTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Start modded template of the kiosk (must belong to this project)
          example: d96c6a5c-053f-594b-8552-329d96f1142b
        appearance:
          $ref: '#/components/schemas/Appearance'
    Project:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        name: { type: string, example: Havets Hemmeligheder }
        appearance:
          $ref: '#/components/schemas/Appearance'
        mainModdedTemplateId: { type: string, format: uuid, nullable: true, example: d96c6a5c-053f-594b-8552-329d96f1142b }
        latestVersionNumber: { type: integer, nullable: true, example: 3 }
        _links:
          $ref: '#/components/schemas/Links'
    ProjectPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, example: 1 }
    Appearance:
      type: object
      description: Presentation only (colours, fonts). Stored as JSON, never queried.
      properties:
        backgroundColor: { type: string, example: '#0A6E8A' }
        buttonColor: { type: string, example: '#F2C14E' }
        textColor: { type: string, example: '#FFFFFF' }
        fontFamily: { type: string, example: Nunito }

    # ---- versions / snapshot
    VersionSummary:
      type: object
      required: [versionNumber, publishedAt]
      properties:
        versionNumber: { type: integer, example: 3 }
        publishedAt: { type: string, format: date-time, example: '2026-11-08T10:15:00Z' }
    PublishedVersion:
      type: object
      required: [projectId, versionNumber, mainModdedTemplateId, moddedTemplates]
      properties:
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        versionNumber: { type: integer, example: 3 }
        publishedAt: { type: string, format: date-time, example: '2026-11-08T10:15:00Z' }
        appearance:
          $ref: '#/components/schemas/Appearance'
        mainModdedTemplateId: { type: string, format: uuid, example: d96c6a5c-053f-594b-8552-329d96f1142b }
        moddedTemplates:
          type: array
          items:
            $ref: '#/components/schemas/PublishedModdedTemplate'
    PublishedModdedTemplate:
      type: object
      required: [id, templateType]
      properties:
        id: { type: string, format: uuid, example: d96c6a5c-053f-594b-8552-329d96f1142b }
        templateType:
          type: string
          description: Selects which Blazor template component renders this modded template
          example: menu-buttons
        title: { type: string, example: Vælg en aktivitet }
        appearance:
          $ref: '#/components/schemas/Appearance'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedItem'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PublishedQuestion'
    PublishedItem:
      type: object
      required: [slotKey]
      properties:
        slotKey: { type: string, example: button1 }
        text: { type: string, nullable: true, example: Quiz }
        assetId: { type: string, format: uuid, nullable: true, example: 2869fc10-8584-5962-a4a1-b2e88e2492db }
        assetKind:
          type: string
          enum: [image, video, audio]
          description: Present when assetId is set
        targetModdedTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Modded template this button leads to
          example: 3713b920-e4cf-53a9-8ba2-e474861cf069
    PublishedQuestion:
      type: object
      required: [id, text, answers]
      properties:
        id: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        text: { type: string, example: 'Hvor lang tid tager det en plastflaske at nedbrydes?' }
        assetId: { type: string, format: uuid, nullable: true }
        assetKind:
          type: string
          enum: [image, video, audio]
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PublishedAnswer'
    PublishedAnswer:
      type: object
      description: Deliberately has NO isCorrect property.
      required: [id, text, sortOrder]
      properties:
        id: { type: string, format: uuid, example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98 }
        text: { type: string, example: 450 år }
        assetId: { type: string, format: uuid, nullable: true }
        assetKind:
          type: string
          enum: [image, video, audio]
        sortOrder: { type: integer, example: 3 }

    # ---- sessions
    NicknameWordInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 2, maxLength: 20, pattern: '^[A-Za-zÆØÅæøå]+$', example: Modig }
    NicknameWord:
      type: object
      required: [id, text]
      properties:
        id: { type: string, format: uuid, example: d539bd3e-141b-552a-beb5-869106903a3a }
        text: { type: string, example: Modig }
    NicknameWordPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NicknameWord'
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, example: 100 }
    NicknameInput:
      type: object
      description: The guest's choice, picked from the 10 suggested words
      required: [firstWordId, secondWordId, number]
      properties:
        firstWordId: { type: string, format: uuid, example: d539bd3e-141b-552a-beb5-869106903a3a }
        secondWordId: { type: string, format: uuid, example: d27e1f33-f8a9-57d0-bc0b-0394887f2279 }
        number: { type: integer, minimum: 0, maximum: 99, example: 42 }
    SessionInput:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
    Session:
      type: object
      required: [id, projectId, startedAt]
      properties:
        id: { type: string, format: uuid, example: 3f2b8c1e-6a4d-4b0e-9d57-1c2a7e5f9a10 }
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        startedAt: { type: string, format: date-time, example: '2026-11-08T10:20:00Z' }
    QuizResultInput:
      type: object
      description: The guest's choice of one answer option for one question
      required: [questionId, answerId]
      properties:
        questionId: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        answerId: { type: string, format: uuid, example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98 }
    QuizResult:
      type: object
      description: One guest's answer to one question, with the server's verdict
      required: [questionId, answerId, isCorrect, correctAnswerId]
      properties:
        questionId: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        answerId: { type: string, format: uuid, example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98 }
        isCorrect: { type: boolean, example: true }
        correctAnswerId:
          type: string
          format: uuid
          description: Revealed only after the guest has answered
          example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98
    SessionSummary:
      type: object
      required: [id, totalQuestions, answered, correct, percentage, allGuestsAveragePercentage]
      properties:
        id: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        totalQuestions:
          type: integer
          description: Number of questions possible in the project (the X in "7 of X")
          example: 10
        answered: { type: integer, example: 10 }
        correct: { type: integer, example: 7 }
        percentage:
          type: number
          format: double
          description: correct / totalQuestions * 100
          example: 70.0
        allGuestsAveragePercentage: { type: number, format: double, example: 62.4 }

    # ---- statistics
    QuestionStatistics:
      type: object
      required: [questionId, totalAnswers, correctPercentage, answers]
      properties:
        questionId: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        totalAnswers: { type: integer, example: 1196 }
        correctPercentage: { type: number, format: double, example: 27.3 }
        answers:
          type: array
          items:
            type: object
            required: [answerId, count, percentage]
            properties:
              answerId: { type: string, format: uuid, example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98 }
              count: { type: integer, example: 328 }
              percentage: { type: number, format: double, example: 27.4 }
    ProjectStatistics:
      type: object
      required: [projectId, totalSessions, totalAnswers, averageCorrectPercentage]
      properties:
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        totalSessions: { type: integer, example: 120 }
        totalAnswers: { type: integer, example: 1196 }
        averageCorrectPercentage: { type: number, format: double, example: 62.4 }

    # ---- templates
    Template:
      type: object
      required: [type, displayName, category, slots]
      properties:
        type: { type: string, example: menu-buttons }
        displayName: { type: string, example: Hovedmenu med knapper }
        category:
          type: string
          enum: [menu, quiz, fact]
        slots:
          type: array
          description: Editable content slots with fixed positions in the component
          items:
            $ref: '#/components/schemas/SlotDefinition'
        appearanceFields:
          type: array
          items:
            $ref: '#/components/schemas/AppearanceFieldDefinition'
        questionRules:
          $ref: '#/components/schemas/QuestionRules'
    SlotDefinition:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string, example: button1 }
        label: { type: string, example: Knap 1 }
        kind:
          type: string
          description: Which asset kind an image, video or audio slot accepts
          enum: [text, image, video, audio, button]
          example: button
        required: { type: boolean, example: true }
        maxLength: { type: integer, nullable: true, example: 40 }
    AppearanceFieldDefinition:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string, example: backgroundColor }
        label: { type: string, example: Baggrundsfarve }
        kind:
          type: string
          enum: [color, font]
        allowedValues:
          type: array
          nullable: true
          items: { type: string }
    QuestionRules:
      type: object
      nullable: true
      description: Present only for templates that hold questions
      properties:
        maxQuestions: { type: integer, example: 10 }
        answersPerQuestion: { type: integer, example: 4 }

    # ---- modded templates
    ModdedTemplateUpdate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, example: Vælg en aktivitet }
        appearance:
          $ref: '#/components/schemas/Appearance'
        sortOrder: { type: integer, example: 1 }
    ModdedTemplateCreate:
      allOf:
        - $ref: '#/components/schemas/ModdedTemplateUpdate'
        - type: object
          required: [templateType]
          properties:
            templateType: { type: string, example: menu-buttons }
    ModdedTemplateSummary:
      type: object
      required: [id, projectId, templateType, title]
      properties:
        id: { type: string, format: uuid, example: d96c6a5c-053f-594b-8552-329d96f1142b }
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        templateType: { type: string, example: menu-buttons }
        title: { type: string, example: Vælg en aktivitet }
        sortOrder: { type: integer, example: 1 }
        _links:
          $ref: '#/components/schemas/Links'
    ModdedTemplate:
      type: object
      required: [id, projectId, templateType, title]
      properties:
        id: { type: string, format: uuid, example: d96c6a5c-053f-594b-8552-329d96f1142b }
        projectId: { type: string, format: uuid, example: 5e528632-2b56-555f-8467-ed93e2a5ad60 }
        templateType: { type: string, example: menu-buttons }
        title: { type: string, example: Vælg en aktivitet }
        appearance:
          $ref: '#/components/schemas/Appearance'
        sortOrder: { type: integer, example: 1 }
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModdedTemplateItem'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        _links:
          $ref: '#/components/schemas/Links'

    # ---- items
    ModdedTemplateItemInput:
      type: object
      properties:
        text: { type: string, nullable: true, maxLength: 500, example: Quiz }
        assetId:
          type: string
          format: uuid
          nullable: true
          description: Media file for this slot. Its kind must match the slot.
          example: 2869fc10-8584-5962-a4a1-b2e88e2492db
        targetModdedTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Modded template the button leads to (same project)
          example: 3713b920-e4cf-53a9-8ba2-e474861cf069
    ModdedTemplateItem:
      allOf:
        - type: object
          required: [slotKey]
          properties:
            slotKey: { type: string, example: button1 }
        - $ref: '#/components/schemas/ModdedTemplateItemInput'

    # ---- questions and answers (admin representation)
    QuestionInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500, example: 'Hvor lang tid tager det en plastflaske at nedbrydes?' }
        assetId: { type: string, format: uuid, nullable: true }
        sortOrder: { type: integer, example: 1 }
    Question:
      type: object
      required: [id, moddedTemplateId, text, answers]
      properties:
        id: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        moddedTemplateId: { type: string, format: uuid, example: 3713b920-e4cf-53a9-8ba2-e474861cf069 }
        text: { type: string, example: 'Hvor lang tid tager det en plastflaske at nedbrydes?' }
        assetId: { type: string, format: uuid, nullable: true }
        sortOrder: { type: integer, example: 1 }
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
    AnswerInput:
      type: object
      required: [text, isCorrect]
      properties:
        text: { type: string, minLength: 1, maxLength: 200, example: 450 år }
        assetId: { type: string, format: uuid, nullable: true }
        isCorrect: { type: boolean, example: true }
        sortOrder: { type: integer, example: 3 }
    Answer:
      allOf:
        - type: object
          required: [id, questionId]
          properties:
            id: { type: string, format: uuid, example: 6ddb1856-5ac7-5dc7-b6c2-0b6f97577f98 }
            questionId: { type: string, format: uuid, example: c0bf18f4-edc3-530a-9de3-0a61b2932826 }
        - $ref: '#/components/schemas/AnswerInput'

    # ---- assets
    AssetKind:
      type: string
      description: Derived by the server from the file content
      enum: [image, video, audio]
    Asset:
      type: object
      required: [id, kind, originalName, contentType, sizeBytes, url]
      properties:
        id: { type: string, format: uuid, example: 2869fc10-8584-5962-a4a1-b2e88e2492db }
        kind:
          $ref: '#/components/schemas/AssetKind'
        originalName: { type: string, example: havskildpadde.png }
        contentType: { type: string, example: image/png }
        sizeBytes: { type: integer, format: int64, example: 183204 }
        uploadedAt: { type: string, format: date-time }
        url: { type: string, example: /api/v1/assets/2869fc10-8584-5962-a4a1-b2e88e2492db }
    AssetPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalCount: { type: integer, example: 1 }

    # ---- errors
    Problem:
      type: object
      description: RFC 7807 ProblemDetails
      required: [title, status]
      properties:
        type: { type: string, example: 'https://tools.ietf.org/html/rfc7231#section-6.5.4' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example:
                name: [The Name field is required.]

  responses:
    ValidationError:
      description: The request body or parameters are invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            title: One or more validation errors occurred.
            status: 400
            detail: The Name field is required.
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
            detail: Missing, invalid or expired token.
    Forbidden:
      description: Authenticated but not in the Admin role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            detail: The Admin role is required.
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: The requested resource does not exist.
    Conflict:
      description: The request conflicts with the current state of the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
            detail: The resource is still in use or already exists.
    PreconditionFailed:
      description: ETag mismatch, the resource was changed by someone else. Reload and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Precondition Failed
            status: 412
            detail: The resource was changed by someone else. Reload and retry.
    PreconditionRequired:
      description: The If-Match header is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Precondition Required
            status: 428
            detail: The If-Match header is required.
    Unprocessable:
      description: Request is well formed but violates a business rule
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unprocessable Entity
            status: 422
            detail: The request violates a business rule.
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, example: 30 }
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Too Many Requests
            status: 429
            detail: Rate limit exceeded. Retry later.
    PayloadTooLarge:
      description: The uploaded file exceeds the size limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Payload Too Large
            status: 413
            detail: The file exceeds the size limit for its kind.
    UnsupportedMediaType:
      description: File type not allowed (images, mp4/webm/mkv video, mp3/wav/m4a audio only)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unsupported Media Type
            status: 415
            detail: Only images, mp4/webm/mkv video and mp3/wav/m4a audio are allowed.
    RangeNotSatisfiable:
      description: The requested byte range is outside the file
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Range Not Satisfiable
            status: 416
            detail: The requested byte range is outside the file.