openapi: 3.0.3
info:
  title: Økolariet Exhibition API
  version: 1.0.3
  contact:
    name: Økolariet project group
  description: |
    Template-driven exhibition system. Admins build projects in the editor,
    publish immutable versions, and the touchscreen kiosk plays the latest
    published version anonymously.

    Terminology:
    - Staff: a staff member who logs in with e-mail and password and edits content.
    - Guest: an anonymous visitor at the kiosk. A guest exists only as a Session
      with a server generated id. No personal data is stored.
    - User: a guest who, at the end of a quiz, chooses to save their result under
      a nickname. A User holds only a nickname, which quiz was played and the
      score. The nickname is built from approved words and a number, so no free
      text and no personal data is stored. Staff can delete users.

    Conventions:
    - Anonymous endpoints (kiosk) declare `security: []`.
    - All other endpoints require a JWT with the Admin role.
    - Errors are always RFC 7807 ProblemDetails (`application/problem+json`).
    - The published snapshot never contains the correct answers; the server
      decides correctness.
servers:
  - url: http://localhost:5000/api/v1
    description: Local Docker Compose
  - url: http://localhost:4010
    description: Prism mock server (Prism ignores the /api/v1 base path, so the mock serves routes at the root)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Staff
  - name: Users
  - name: Projects
  - name: Versions
  - name: Nicknames
  - name: Sessions
  - name: Statistics
  - name: Templates
  - name: ModdedTemplates
  - name: Items
  - name: Questions
  - name: Answers
  - name: Assets

paths:
  # ------------------------------------------------------------------ AUTH
  /auth/tokens:
    post:
      tags: [Auth]
      operationId: createToken
      summary: Log in, or renew a login (staff)
      description: |
        One resource, two grant types:
        - `password`: e-mail and password. Returns an access token and a refresh token.
        - `refresh_token`: exchanges a valid refresh token for a new pair. The
          old refresh token is invalidated (rotation). Presenting an
          already-used refresh token revokes the whole login (theft detection).

        The access token is a short-lived JWT (15 minutes) with the claims
        `sub` (staff id), `email`, `role`, `sid` (login id) and `exp`. The refresh
        token is an opaque random value that the server stores only as a hash,
        valid for 8 hours.

        Failed logins always return the same generic 401, whether the e-mail
        exists or not. After 5 failed attempts for an e-mail, further attempts
        are refused with 429 and `Retry-After` for 15 minutes. Also rate limited
        per client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/tokens/current:
    delete:
      tags: [Auth]
      operationId: deleteCurrentToken
      summary: Log out (staff)
      description: |
        Revokes the refresh token of the current login, so it can no longer be
        renewed. The access token itself is stateless and stays valid until it
        expires (at most 15 minutes), so the editor must also discard it.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/password-resets:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Ask for a password reset e-mail (staff, anonymous)
      description: |
        Always returns 202, whether the e-mail belongs to a staff member or not, so the
        endpoint cannot be used to find out which e-mails exist. If it does, a
        link with a single-use reset token (valid for 30 minutes) is e-mailed.
        Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: If the e-mail is known, a reset link has been sent
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password:
    put:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token (staff, anonymous)
      description: |
        Completes a password reset. The token is single use and expires after
        30 minutes (otherwise 422). The new password must be at least 12
        characters. All existing logins for the staff member are revoked. The token is
        sent in the body, not the URL, so it does not end up in server logs.
        Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletion'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ----------------------------------------------------------------- STAFF
  /staff:
    get:
      tags: [Staff]
      operationId: listStaff
      summary: List staff members (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of staff members. Password hashes are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Staff]
      operationId: createStaff
      summary: Create a staff member (admin)
      description: |
        The e-mail is the login name and must be unique, compared
        case-insensitively (otherwise 409). The password is hashed on the
        server. The first admin is seeded when the system is installed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
      responses:
        '201':
          description: Staff member created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /staff/me:
    get:
      tags: [Staff]
      operationId: getCurrentStaff
      summary: Get the logged-in staff member (admin)
      responses:
        '200':
          description: The staff member the token belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /staff/{staffId}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      operationId: getStaff
      summary: Get a staff member (admin)
      responses:
        '200':
          description: The staff member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Staff]
      operationId: updateStaff
      summary: Change a staff member's e-mail or role (admin)
      description: |
        Last write wins. Fails with 409 if the e-mail is taken, and with 422 if
        the change would leave the system without an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
      responses:
        '200':
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [Staff]
      operationId: deleteStaff
      summary: Delete a staff member (admin)
      description: |
        Blocked with 422 if it would delete yourself or the last admin.
      responses:
        '204':
          description: Staff member deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /staff/{staffId}/password:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    put:
      tags: [Staff]
      operationId: setStaffPassword
      summary: Change a staff member's password (admin)
      description: |
        Changing your own password requires `currentPassword`. An admin
        resetting someone else's password omits it. The new password must be at
        least 12 characters. All existing logins of that staff member are revoked.
        Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # -------------------------------------------------------------- PROJECTS
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          headers:
            Location:
              description: URI of the new project
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project (admin)
      responses:
        '200':
          description: The project
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Replace a project's editable fields (admin)
      description: |
        Uses optimistic concurrency. `If-Match` must carry the ETag from the last GET.
        `mainModdedTemplateId` must belong to this project (otherwise 422).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project (admin)
      description: |
        Permanently removes an outdated project together with its modded templates,
        items, questions, answers, published versions, users and all collected
        statistics. This cannot be undone.
      responses:
        '204':
          description: Project and all related data deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # -------------------------------------------------------------- VERSIONS
  /projects/{projectId}/versions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Versions]
      operationId: listVersions
      summary: List published versions (admin)
      responses:
        '200':
          description: Version history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Versions]
      operationId: publishVersion
      summary: Publish the project (admin)
      description: |
        Snapshots the current state of the project as a new immutable version.
        Fails with 422 if the project is not publishable (for example a quiz
        question without exactly one correct answer).
      responses:
        '201':
          description: Version published
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /projects/{projectId}/versions/latest:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Versions]
      operationId: getLatestVersion
      summary: Get the latest published version (kiosk, anonymous)
      description: |
        Returns the published snapshot. Correct answers are NOT included.
        Clients should revalidate with `If-None-Match`.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The published snapshot
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              schema: { type: string, example: 'no-cache' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedVersion'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/versions/draft:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Versions]
      operationId: getDraftVersion
      summary: Preview the unpublished project as the kiosk would render it (admin)
      description: |
        Builds the same representation as a published snapshot from the live
        editing tables without saving anything, so the editor can preview
        before publishing. `versionNumber` is 0. Correct answers are not
        included. Returns 422 if the project cannot be rendered yet (for
        example no start modded template).
      responses:
        '200':
          description: The draft rendered as a snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # ------------------------------------------------------------- NICKNAMES
  /nickname-suggestions:
    get:
      tags: [Nicknames]
      operationId: getNicknameSuggestions
      summary: Get 10 random safe words to build a nickname from (kiosk, anonymous)
      description: |
        Returns 10 randomly chosen active words from the approved word list
        (about 100). Used at the end of a quiz when a guest chooses to add a
        nickname: they pick 2 of the words and a number and send the choice to
        `POST /users`. Never cached, so each guest gets a
        fresh selection. Rate limited.
      security: []
      responses:
        '200':
          description: Ten random words
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                minItems: 10
                maxItems: 10
                items:
                  $ref: '#/components/schemas/NicknameWord'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /nickname-words:
    get:
      tags: [Nicknames]
      operationId: listNicknameWords
      summary: List the approved word list (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of words
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicknameWordPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Nicknames]
      operationId: createNicknameWord
      summary: Add a word to the approved list (admin)
      description: Words are unique, compared case-insensitively (otherwise 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NicknameWordInput'
      responses:
        '201':
          description: Word added
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicknameWord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /nickname-words/{nicknameWordId}:
    parameters:
      - $ref: '#/components/parameters/NicknameWordId'
    delete:
      tags: [Nicknames]
      operationId: deleteNicknameWord
      summary: Remove a word from the approved list (admin)
      description: |
        Existing users keep their nickname, because the finished nickname is
        stored as text. Blocked with 422 if fewer than 10 words would remain,
        since the kiosk needs 10 to make suggestions.
      responses:
        '204':
          description: Word removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  # -------------------------------------------------------------- SESSIONS
  /sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Start a guest session (kiosk, anonymous)
      description: |
        The server generates the session id. A session needs no nickname and no
        personal data. Answers are recorded against the session id only. A
        guest who wants to save their result at the end of a quiz creates a
        User with `POST /users`. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionInput'
      responses:
        '201':
          description: Session created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get a session with score and comparison (kiosk, anonymous)
      description: Answers given, score, percentage and the all-guest average.
      security: []
      responses:
        '200':
          description: The session summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/results:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: submitResult
      summary: Submit a guest's answer to a question, creating a result (kiosk, anonymous)
      description: |
        The server checks correctness and stores the result. Insert-only, so
        concurrent guests never conflict. Rate limited.

        Rules: the question must belong to the session's project and be
        active, and the answer must belong to that question (otherwise 422).
        A question can be answered once per session (otherwise 409).

        Terminology: an "answer" is one of the options of a question. What a
        guest submits is a "result" (a QuizResult).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizResultInput'
      responses:
        '201':
          description: Answer recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ------------------------------------------------------- USERS (SAVED SCORES)
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List saved scores, for example a leaderboard (kiosk, anonymous)
      description: |
        Public, because it holds only nicknames and scores. Filter by quiz and
        sort by best score or newest.
      security: []
      parameters:
        - name: moddedTemplateId
          in: query
          required: false
          description: Only users who played this quiz
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [bestScore, newest]
            default: bestScore
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags: [Users]
      operationId: createUser
      summary: Save a finished quiz result under a nickname (kiosk, anonymous)
      description: |
        Called when a guest chooses to upload their result at the end of a quiz.
        The server builds the nickname from the two words (capitalised, in the
        order given) followed by the number, for example `ModigRæv42`, and
        calculates the score itself from the session's recorded answers. The
        client never sends a score.

        Rules (otherwise 422): both words must be active words from the
        approved list and must differ, the number must be 0 to 99, the quiz
        must belong to the session's project, and every question of the quiz
        must have been answered. A session can save one result per quiz
        (otherwise 409). Nicknames are not unique, the id is the identity.
        Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Result saved
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one saved score (kiosk, anonymous)
      security: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a saved score (staff, admin role)
      description: |
        Only a staff member with a valid admin JWT can delete, for example to
        remove an inappropriate nickname combination or a request from a guest.
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /modded-templates/{moddedTemplateId}/users:
    parameters:
      - $ref: '#/components/parameters/ModdedTemplateId'
    delete:
      tags: [Users]
      operationId: deleteModdedTemplateUsers
      summary: Delete all saved scores for a quiz (staff, admin role)
      description: Clears the leaderboard of one quiz. Cannot be undone.
      responses:
        '204':
          description: All users for the quiz deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------ STATISTICS
  /projects/{projectId}/statistics:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Statistics]
      operationId: getProjectStatistics
      summary: Overall statistics for a project (kiosk, anonymous)
      description: Used for the "how do all guests do on average" screen.
      security: []
      responses:
        '200':
          description: Aggregated statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatistics'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/results:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    delete:
      tags: [Statistics]
      operationId: deleteProjectResults
      summary: Delete all collected results for a project (admin)
      description: |
        Removes every guest session and answer recorded for the project, and
        all saved users (nicknames and scores). Questions, answers and content
        are untouched.
      responses:
        '204':
          description: All results for the project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /questions/{questionId}/statistics:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Statistics]
      operationId: getQuestionStatistics
      summary: Answer distribution for one question (admin)
      responses:
        '200':
          description: Counts and percentages per answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /questions/{questionId}/results:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    delete:
      tags: [Statistics]
      operationId: deleteQuestionResults
      summary: Reset the results for one question (admin)
      description: Use when the meaning of a question changed and old statistics no longer apply.
      responses:
        '204':
          description: Results for the question deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

